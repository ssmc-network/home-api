name: Build on Tag

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン(vX.Y.Z)。タグではなくブランチ/コミットからworkflow_dispatchする場合に指定する(未指定時はGITHUB_REFから自動判定)"
        required: false
        type: string

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  build_docker_image_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract release version
        id: extract_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            RELEASE_VERSION="${{ inputs.version }}"
            RELEASE_VERSION="${RELEASE_VERSION#v}"
          else
            RELEASE_VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: OIDC token
        id: docker_oidc
        uses: docker/oidc-action@v1
        with:
          connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ssmcnetwork
          password: ${{ steps.docker_oidc.outputs.token }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: prd
          push: true
          tags: |
            ssmcnetwork/home-api:latest
            ssmcnetwork/home-api:${{ env.RELEASE_VERSION }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
