[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.129.0"
uvicorn = {extras = ["standard"], version = "^0.41.0"}
pydantic-settings = "^2.9.1"
yt-dlp = "^2026.2.4"
redis = "^7.1.0"
tzdata = ">=2024.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.1"
mypy = "^1.16.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
# Redisのデータ構造(ハッシュ/リスト/blpop)そのものが検証対象になるモジュールが
# あるため、mockではなく実際にコマンドを実行できるfakeredisを使っている。
# testcontainersを採用しなかった理由はCLAUDE.md参照。
fakeredis = "^2.33.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
disable_error_code = "misc"

[tool.ruff]
target-version = "py313"
line-length = 119

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "W", "C90", "PL", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.pylint]
max-args = 20
